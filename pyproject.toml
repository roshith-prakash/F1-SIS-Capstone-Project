[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-sis-strategy"
version = "0.1.0"
description = "Adaptive AI Decision Intelligence Platform for Formula 1 Strategy"
readme = "Readme.md"
requires-python = ">=3.9"
dependencies = [
    "fastf1",
    "pandas",
    "numpy",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
